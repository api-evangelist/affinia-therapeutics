name: Affinia Therapeutics
description: 'Affinia Therapeutics is a clinical-stage biotechnology company in Waltham,
  Massachusetts pioneering next-generation adeno-associated virus (AAV) gene therapies.
  Using AI and structural modeling to rationally design novel capsids that better target
  tissues for improved safety and effectiveness, Affinia develops therapeutic cargoes
  for devastating rare and prevalent diseases of the heart and the nervous system. Its
  lead program, AFTX-201, targets BAG3-associated dilated cardiomyopathy and is being
  evaluated in the UPBEAT trial. Affinia Therapeutics is a portfolio company of GV
  (Google Ventures). This company profile carries no public API surface; it is tracked
  in the API Evangelist network for identity and demand signal.'
